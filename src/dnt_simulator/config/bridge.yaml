# Reliable output preserves compatibility with RTAB-Map/RViz defaults. Small
# queues bound buffering; lazy streams only subscribe to Gazebo when needed.
- topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  lazy: false
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/image
  gz_topic_name: /sim/front_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/depth
  gz_topic_name: /sim/front_camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/camera_info
  gz_topic_name: /sim/front_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/gt_odom
  gz_topic_name: /model/bluerov2_heavy/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/boxes
  gz_topic_name: /sim/front_camera/boxes
  ros_type_name: vision_msgs/msg/Detection2DArray
  gz_type_name: gz.msgs.AnnotatedAxisAligned2DBox_V
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
# 1 kHz FRD IMU (the same sensor ArduSub flies on) for visual-inertial odometry.
# Deeper queues: dropped IMU samples break cuVSLAM's preintegration.
- ros_topic_name: /vision/imu
  gz_topic_name: /world/pool_world/model/bluerov2_heavy/link/base_link/sensor/imu_sensor/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 100
  publisher_queue: 100
# Downward camera (model.sdf bottom_camera) for optical-flow velocity. Gazebo
# publishes its info on the bare /camera_info (topic has no parent namespace).
- ros_topic_name: /vision/bottom/image
  gz_topic_name: /bottom_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /vision/bottom/camera_info
  gz_topic_name: /camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1

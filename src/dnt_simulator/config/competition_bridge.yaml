# Competition consumers keep their original topics. No reverse image/cloud
# bridge, and no Gazebo subscription/copying until a ROS consumer appears.
- topic_name: /front_camera/left/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- topic_name: /front_camera/right/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- topic_name: /sim/front_camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /bottom_camera
  gz_topic_name: /sim/bottom_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
  subscriber_queue: 1
  publisher_queue: 1
